<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>CLIENT SIDE VAILDATION</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
<style>
	.error{
		color:red;
		font-size: 12px;
	}
</style>
<script>
	function clearForm()
	{
		document.getElementById("unameerror").innerText="";
		document.getElementById("passeerror").innerText="";
		document.getElementById("cpasserror").innerText="";
		 document.getElementById("mobnoerror").innerText="";
	}
	function validateForm()
	{
		clearForm();
		var valid=true;
		var uname=document.getElementById("uname").value.trim();
		//alert(uname);
		var pass=document.getElementById("pass").value.trim();
		//alert(pass);
		var cpass=document.getElementById("cpass").value.trim()
		//alert(cpass);
		var mobno=document.getElementById("mobno").value.trim();
		//alert(mobno);
		if(uname.length<5)
		{
			document.getElementById("unameerror").innerText="USERNAME MUST BE 5 CHARECTER LONG";
			valid=false;
		}
		if(!(pass.length>=5 && pass.length<=8))
		{
			document.getElementById("passeerror").innerText="PASSWORD MUST BE IN BETWEEN  5 TO 8 CHARECTER LONG";
			valid=false;
		}
		if(pass!=cpass)
		{
			document.getElementById("cpasserror").innerText="PASWORD MISMATCH";
			valid=false;
		}
		if(isNaN(mobno))
		{
		  document.getElementById("mobnoerror").innerText="MOBILE NUMBER MUST DIGIT ONLY";
			valid=false;
		}
		if(valid)
		{
			alert("REGISTRATION SUCCESSFULL");
		}
		return valid;
	}
</script>
</head>
<body>
<div style="width:30%;margin:50px auto;">
	<h2 class="text-success">REGISTRATION FORM</h2>
	<form action="Success.html" onsubmit="return validateForm()" method="post">
		<input type="text" id="uname" class="form-control" placeholder="ENTER THE USERNAME"/>
		<h3 id="unameerror" class="error"></h3>
		<input type="password" id="pass" class="form-control" placeholder="ENTER THE PASSWORD"/>
		<h3 id="passeerror" class="error"></h3>
		<input type="password" id="cpass" class="form-control" placeholder="ENTER YOUR CONFIRM PASSWORD"/>
		<h3 id="cpasserror" class="error"></h3>
		<input type="text" id="mobno" class="form-control" placeholder="ENTER THE MOBILE NO"/>
		<h3 id="mobnoerror" class="error"></h3>
		<input type="submit" class="btn btn-outline-success" value="REGISTER"/>
	</form>
</div>
</body>
</html>
