<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>FORM DESIGN</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div style="width: 30%;margin:50px auto;">
	<form action="Show.html" method="post">
		<h3 class="text-warning">REGISTRATION FORM</h3>
		<input type="text" name="id" class="form-control" placeholder="ENTER YOUR ID"/>
		<input type="text" name="ename" class="form-control" placeholder="ENTER YOUR NAME"/>
		<input type="text" name="ephno" class="form-control" placeholder="ENTER YOUR PHONE NO "/>
		<select name="dept" class="form-select">
			<option value="">CHOOSE DEPARTMENT</option>
			<option value="MKTG">MKTG</option>
			<option value="FINANCE">FINANCE</option>
			<option value="HR">HR</option>
			<option value="IT">IT</option>
		</select>
		<input type="submit" class="btn btn-outline-primary" value="REGISTER"/>
	</form>
</div>
</body>
</html>
