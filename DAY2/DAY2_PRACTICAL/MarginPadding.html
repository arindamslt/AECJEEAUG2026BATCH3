<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>MARGIN PADDING</title>
<style>
	#parent{
		border:10px solid red;
	}
	#child1{
		border:10px solid blue;
		margin:10px 15px 20px 25px;
		padding: 5px 10px 15px 20px;
	}
	#child2{
		border:10px solid black;
		margin:15px 30px;
		padding: 25px 15px;
	}
</style>
</head>
<body>
<div id="parent">
	<h2>PARENT DIV</h2>
	<div id="child1">
		<h2>CHILD1 DIV</h2>
	</div>
	<div id="child2">
		<h2>CHILD2 DIV</h2>
	</div>
</div>
</body>
</html>
