<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>TABLE DESIGN WITH BOOTSTRAP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div style="width:30%;margin:50px auto;">
	<h2 style="text-align: center;" class="text-white bg-dark">EMPLOYEE DATA</h2>
	<table  class="table table-hover table-striped table-bordered">
	
	<thead class="table-dark">
		<tr>
			<th>ID</th>
			<th>NAME</th>
			<th>DEPARTMENT</th>
		</tr>
	</thead>
	<tbody>
		<tr>
			<td>1</td>
			<td>ALOKE</td>
			<td>FINANCE</td>
		</tr>
		<tr>
			<td>2</td>
			<td>ANNANYA</td>
			<td>HR</td>
		</tr>
		<tr>
			<td>3</td>
			<td>RAMAN</td>
			<td>IT</td>
		</tr>
	</tbody>
</table>
</div>
</body>
</html>
