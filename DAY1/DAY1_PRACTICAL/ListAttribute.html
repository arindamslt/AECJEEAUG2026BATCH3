<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>LIST ATTRIBUTE</title>
</head>
<body>
<!-- UNORDERD LIST-->
<ul type="square">
	<li>HTML</li>
	<li>CSS</li>
	<li>JAVASCRIPT</li>
</ul>
<ul type="circle">
	<li>JAVA</li>
	<li>DOT NET</li>
	<li>PHP</li>
</ul>
<!-- ORDERED LIST-->
<ol start="100">
	<li>ANGULAR JS</li>
	<li>VUE JS</li>
	<li>REACT JS</li>
</ol>
<ol start="100" reversed>
	<li>ORACLE</li>
	<li>MYSQL</li>
	<li>SQLSERVER</li>
</ol>

</body>
</html>
